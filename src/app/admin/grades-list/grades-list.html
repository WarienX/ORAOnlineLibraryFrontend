<div class="page-container">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1>Grades</h1>
      <p>Manage all grades in the school</p>
    </div>

    <button mat-flat-button color="primary" class="add-btn" routerLink="/admin/grades/add">
      <mat-icon>add</mat-icon>
      Add New Grade
    </button>
  </div>

  <!-- Content Card -->
  <div class="content-card">

    @if (isLoading()) {
      <div class="state-container">
        <mat-spinner diameter="42"></mat-spinner>
        <p>Loading grades...</p>
      </div>
    } @else if (grades.length === 0) {
      <div class="state-container empty">
        <div class="empty-icon">
          <mat-icon>class</mat-icon>
        </div>
        <h3>No grades found</h3>
        <p>Get started by creating your first grade.</p>
        <button mat-flat-button color="primary" routerLink="/admin/grades/add">
          <mat-icon>add</mat-icon>
          Add Grade
        </button>
      </div>
    } @else {
      <div class="table-wrapper">
        <table mat-table [dataSource]="grades" class="grades-table">

          <!-- Grade Number -->
          <ng-container matColumnDef="gradeNumber">
            <th mat-header-cell *matHeaderCellDef>Grade Number</th>
            <td mat-cell *matCellDef="let grade">
              <span class="grade-number">{{ grade.grade_number }}</span>
            </td>
          </ng-container>

          <!-- Grade Name -->
          <ng-container matColumnDef="gradeName">
            <th mat-header-cell *matHeaderCellDef>Grade Name</th>
            <td mat-cell *matCellDef="let grade">
              <span class="grade-name">{{ grade.name }}</span>
            </td>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
            <td mat-cell *matCellDef="let grade" class="actions-cell">
              <button mat-icon-button [matMenuTriggerFor]="menu" class="more-btn">
                <mat-icon>more_vert</mat-icon>
              </button>

              <mat-menu #menu="matMenu">
                <button mat-menu-item [routerLink]="['/admin/grades/edit', grade.id]">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item class="delete-item">
                  <mat-icon>delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    }

  </div>
</div>
